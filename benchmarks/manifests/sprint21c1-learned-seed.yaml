benchmark_id: sprint21c1-learned-seed
version: "1"
title: Sprint 21C1 durable learned evidence seed set
description: >-
  48 fixed-seed credential-free cases across lifecycle persistence, activation
  refusal, rollback, governed outcome intake, dataset selection determinism, artifact
  verification, replay integrity and standing governance guarantees. Every case
  measures whether a policy held. None measures accuracy or uplift, and passing the
  whole set says nothing about Gate L2.
default_configuration: {mode: learned-replay}
source: Cognitive OS Sprint 21C1 executable backlog
license: Apache-2.0
created_at: 2026-07-27T00:00:00Z
case_matrix:
  generic:
    # lifecycle persistence: every reachable state, twice (fresh store each run)
    - {id: learned-seed-001, scenario: lifecycle, target: registered, expected: passed}
    - {id: learned-seed-002, scenario: lifecycle, target: shadow, expected: passed}
    - {id: learned-seed-003, scenario: lifecycle, target: verified, expected: passed}
    - {id: learned-seed-004, scenario: lifecycle, target: disabled, expected: passed}
    - {id: learned-seed-005, scenario: lifecycle, target: retracted, expected: passed}
    - {id: learned-seed-006, scenario: lifecycle, target: registered, expected: passed}
    - {id: learned-seed-007, scenario: lifecycle, target: shadow, expected: passed}
    - {id: learned-seed-008, scenario: lifecycle, target: verified, expected: passed}
    - {id: learned-seed-009, scenario: lifecycle, target: disabled, expected: passed}
    - {id: learned-seed-010, scenario: lifecycle, target: retracted, expected: passed}
    # activation: the happy path and every named evidence defect
