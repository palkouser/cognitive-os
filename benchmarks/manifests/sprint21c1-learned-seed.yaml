    - {id: learned-seed-015, scenario: activation, defect: wrong_assessment, expected: rejected}
    - {id: learned-seed-016, scenario: activation, defect: wrong_revision, expected: rejected}
    - {id: learned-seed-017, scenario: activation, defect: refused_approval, expected: rejected}
    - {id: learned-seed-018, scenario: activation, defect: model_approver, expected: rejected}
    - {id: learned-seed-019, scenario: activation, defect: unverified_artifact, expected: rejected}
    # rollback restores exactly the activation the receipt chain names
    - {id: learned-seed-020, scenario: rollback, expected: passed}
    - {id: learned-seed-021, scenario: rollback, expected: passed}
    - {id: learned-seed-022, scenario: rollback, expected: passed}
    # governed outcome intake classification
    - {id: learned-seed-023, scenario: observation, defect: none, expected: accepted}
    - {id: learned-seed-024, scenario: observation, defect: real_run, expected: accepted}
