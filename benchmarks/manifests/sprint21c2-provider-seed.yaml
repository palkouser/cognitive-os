    - {id: provider-seed-048, scenario: governance, variant: default, retention: normalized_content, sensitivity: restricted, expected: directive_refused}
    - {id: provider-seed-049, scenario: governance, variant: default, retention: normalized_content, physical_deletion_required: true, expected: directive_refused}
    - {id: provider-seed-050, scenario: governance, variant: default, retention: hash_only, physical_deletion_required: true, expected: hash_only}
    - {id: provider-seed-051, scenario: governance, variant: default, retention: hash_only, sensitivity: restricted, expected: hash_only}
    - {id: provider-seed-052, scenario: governance, variant: self_verification, retention: hash_only, expected: refused}
    - {id: provider-seed-053, scenario: governance, variant: self_verification, retention: none, expected: refused}
