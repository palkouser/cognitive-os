benchmark_id: sprint21c2-provider-seed
version: "1"
title: Sprint 21C2 governed provider boundary seed set
description: >-
  77 fixed-seed, credential-free, network-free, binary-free cases covering every branch
  the CI gate samples: OpenRouter routing and budget policy, response normalization, the
  Claude Code envelope, the Codex JSONL stream, the independent advisory verifier,
  governed retention and rights, idempotency and retry, selection eligibility, intake
  classification, the mutation guard, runner cleanup and secret scanning. Every case
  measures whether a policy held. None measures accuracy or uplift, and passing the whole
  set says nothing about Gate L2.
default_configuration: {mode: provider-replay}
source: Cognitive OS Sprint 21C2 executable backlog
license: Apache-2.0
created_at: 2026-07-28T00:00:00Z
case_matrix:
  generic:
    # ---------------------------------------------------------------- OpenRouter routing
    - {id: provider-seed-001, scenario: openrouter_route, catalog: free, route: default, expected: routed}
    - {id: provider-seed-002, scenario: openrouter_route, catalog: free, route: free, expected: routed}
    - {id: provider-seed-003, scenario: openrouter_route, catalog: free, route: paid, expected: budget_refused}
    - {id: provider-seed-004, scenario: openrouter_route, catalog: free, route: unknown, expected: unavailable}
    # An unparsable price is treated as not free, so it cannot buy its way past a free-only policy.
    - {id: provider-seed-005, scenario: openrouter_route, catalog: free, route: unpriced, expected: budget_refused}
    - {id: provider-seed-006, scenario: openrouter_route, catalog: paid_only, route: default, expected: unavailable}
    - {id: provider-seed-007, scenario: openrouter_route, catalog: paid_only, route: paid, expected: budget_refused}
    - {id: provider-seed-008, scenario: openrouter_route, catalog: paid_only, route: unknown, expected: unavailable}
    - {id: provider-seed-009, scenario: openrouter_route, catalog: empty, expected: invalid_catalog}
    - {id: provider-seed-010, scenario: openrouter_route, catalog: malformed, expected: invalid_catalog}
    # Free-only lifted, but zero maximum spend still refuses a paid model.
    - {id: provider-seed-011, scenario: openrouter_route, catalog: free, route: paid, require_free: false, expected: budget_refused}
    - {id: provider-seed-012, scenario: openrouter_route, catalog: free, route: paid, require_free: false, maximum_spend_usd: 1.0, expected: routed}
