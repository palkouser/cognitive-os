services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COGOS_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: "${COGOS_POSTGRES_DATABASE}"
      POSTGRES_USER: "${COGOS_POSTGRES_OWNER_USER}"
      POSTGRES_PASSWORD: "${COGOS_POSTGRES_OWNER_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    # Sprint 22B W1-F5. Docker's default /dev/shm is 64 MB, and PostgreSQL allocates parallel
    # workers' dynamic shared memory there. A parallel HNSW build over 10^6 x 768 vectors asks
    # for a ~61 MB segment and dies with `DiskFullError: could not resize shared memory
    # segment`, on a host with 860 GB of free disk — the message names a disk that is not the
    # problem. No corpus below about 10^5 rows reaches this, which is why every sprint until
    # now ran into a ceiling nobody had measured.
    shm_size: 2gb
    volumes:
      - "${COGOS_POSTGRES_DATA}:/var/lib/postgresql/18/docker"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COGOS_POSTGRES_OWNER_USER} -d ${COGOS_POSTGRES_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
