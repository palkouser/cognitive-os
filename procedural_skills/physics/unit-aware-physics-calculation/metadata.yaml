format_version: "1"
canonical_name: unit-aware-physics-calculation
display_name: Unit-Aware Physics Calculation
description: Carry units through every step of a physical calculation using the project-owned registry.
purpose: Return a physical quantity whose units are checked at each step.
domains: [physics]
scope_type: project
scope_id: cognitive-os
sensitivity: internal
problem_signatures:
  - {problem_domain: physics, task_type: unit-aware-calculation}
preconditions:
  - {precondition_id: domain, precondition_type: problem_domain_match, parameters: {allowed: [physics]}}
  - {precondition_id: verifier, precondition_type: verifier_capability, parameters: {capability: physics.dimension}}
inputs:
  - {name: problem, json_type: object, required: true}
outputs:
  - {name: result, json_type: object, required: true, requires_evidence: true}
steps:
  - {step_id: formalize, step_type: artifact_transform, capability_id: domains.formalize}
  - {step_id: execute, step_type: tool_action, capability_id: domains.execute}
  - {step_id: verify, step_type: verification_action, capability_id: physics.dimension}
requirements:
  - {requirement_id: verifier, requirement_type: verifier, capability_id: physics.dimension}
failure_policy: {policy_type: return_to_controller_repair, maximum_fallback_depth: 1}
resource_budget: {maximum_steps: 8, maximum_provider_calls: 0, maximum_tool_calls: 4, maximum_context_builds: 1, maximum_execution_seconds: 30, maximum_repairs: 1, maximum_context_tokens: 4096}
regression_profile: unit-aware-physics-calculation-v1
