format_version: "1"
canonical_name: cross-domain-result-review
display_name: Cross-Domain Result Review
description: Review a domain result against its plan, evidence, and declared limitations.
purpose: Return a review decision that names any missing or contradicted evidence.
domains: [generic]
scope_type: project
scope_id: cognitive-os
sensitivity: internal
problem_signatures:
  - {problem_domain: generic, task_type: cross-domain-review}
preconditions:
  - {precondition_id: domain, precondition_type: problem_domain_match, parameters: {allowed: [generic]}}
  - {precondition_id: verifier, precondition_type: verifier_capability, parameters: {capability: generic.exact_value}}
inputs:
  - {name: problem, json_type: object, required: true}
outputs:
  - {name: result, json_type: object, required: true, requires_evidence: true}
steps:
  - {step_id: formalize, step_type: artifact_transform, capability_id: domains.formalize}
  - {step_id: execute, step_type: tool_action, capability_id: domains.execute}
  - {step_id: verify, step_type: verification_action, capability_id: generic.exact_value}
requirements:
  - {requirement_id: verifier, requirement_type: verifier, capability_id: generic.exact_value}
failure_policy: {policy_type: return_to_controller_repair, maximum_fallback_depth: 1}
resource_budget: {maximum_steps: 8, maximum_provider_calls: 0, maximum_tool_calls: 4, maximum_context_builds: 1, maximum_execution_seconds: 30, maximum_repairs: 1, maximum_context_tokens: 4096}
regression_profile: cross-domain-result-review-v1
